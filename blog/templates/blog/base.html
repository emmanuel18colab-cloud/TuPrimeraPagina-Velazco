<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}BlogApp{% endblock %} | BlogApp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Georgia, serif; background: #fafaf7; color: #1a1a2e; line-height: 1.7; min-height: 100vh; display: flex; flex-direction: column; }
        a { color: #c0392b; text-decoration: none; }
        a:hover { text-decoration: underline; }
        header { background: #1a1a2e; color: #fafaf7; padding: 20px 24px; border-bottom: 3px solid #d4a843; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.8rem; font-weight: normal; }
        header h1 a { color: #fafaf7; }
        header h1 span { color: #d4a843; }
        nav { background: #14142a; border-bottom: 1px solid rgba(255,255,255,0.08); }
        nav a { color: rgba(255,255,255,0.75); padding: 10px 16px; display: inline-block; font-family: Arial, sans-serif; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 2px solid transparent; }
        nav a:hover { color: #d4a843; border-bottom-color: #d4a843; text-decoration: none; }
        main { max-width: 1100px; margin: 0 auto; padding: 40px 24px; flex: 1; width: 100%; }
        .page-header { margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid #ddd8cc; }
        .page-header h1 { font-size: 2rem; font-weight: normal; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .card { background: #fff; border: 1px solid #ddd8cc; border-radius: 4px; padding: 24px; }
        .card h3 { font-size: 1.2rem; margin-bottom: 10px; }
        .card p { color: #4a4a6a; font-size: 0.95rem; }
        .badge { display: inline-block; background: #f0ede6; border: 1px solid #ddd8cc; color: #4a4a6a; font-family: Arial, sans-serif; font-size: 0.72rem; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; }
        .btn { display: inline-block; padding: 10px 22px; border-radius: 4px; font-family: Arial, sans-serif; font-size: 0.85rem; cursor: pointer; border: none; text-decoration: none; }
        .btn-primary { background: #c0392b; color: #fff; }
        .btn-primary:hover { background: #96281b; color: #fff; text-decoration: none; }
        .btn-secondary { background: #f0ede6; color: #1a1a2e; border: 1px solid #ddd8cc; }
        .btn-secondary:hover { background: #ddd8cc; text-decoration: none; }
        .form-container { background: #fff; border: 1px solid #ddd8cc; border-radius: 4px; padding: 32px; max-width: 680px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-family: Arial, sans-serif; font-size: 0.82rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; color: #4a4a6a; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid #ddd8cc; border-radius: 4px; font-family: Georgia, serif; font-size: 0.95rem; color: #1a1a2e; background: #fafaf7; }
        .form-control:focus { outline: none; border-color: #c0392b; }
        .form-check { display: flex; align-items: center; gap: 10px; }
        .form-check-input { width: 18px; height: 18px; accent-color: #c0392b; }
        .form-actions { display: flex; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid #ddd8cc; }
        .messages { list-style: none; margin-bottom: 24px; }
        .messages li { padding: 12px 18px; border-radius: 4px; font-family: Arial, sans-serif; font-size: 0.9rem; margin-bottom: 8px; background: #d5f5e3; color: #1a5e38; border-left: 4px solid #27ae60; }
        .empty-state { text-align: center; padding: 60px 24px; color: #4a4a6a; }
        .empty-state .icon { font-size: 3rem; margin-bottom: 16px; display: block; }
        footer { background: #1a1a2e; color: rgba(255,255,255,0.5); text-align: center; padding: 20px 24px; font-family: Arial, sans-serif; font-size: 0.82rem; border-top: 3px solid #d4a843; }
        footer a { color: #d4a843; }
    </style>
</head>
<body>
<header>
    <h1><a href="{% url 'inicio' %}">Blog<span>App</span></a></h1>
    <a href="{% url 'buscar' %}" class="btn" style="border:1px solid rgba(255,255,255,0.3);color:#fff;">🔍 Buscar</a>
</header>
<nav>
    <a href="{% url 'inicio' %}">Inicio</a>
    <a href="{% url 'lista_posts' %}">Posts</a>
    <a href="{% url 'crear_post' %}">+ Nuevo Post</a>
    <a href="{% url 'lista_autores' %}">Autores</a>
    <a href="{% url 'crear_autor' %}">+ Nuevo Autor</a>
    <a href="{% url 'lista_categorias' %}">Categorías</a>
    <a href="{% url 'crear_categoria' %}">+ Nueva Categoría</a>
    <a href="{% url 'buscar' %}">Buscar</a>
</nav>
<main>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% block contenido %}{% endblock %}
</main>
<footer>
    <p>BlogApp — Proyecto Django MVT | <a href="/admin/">Panel admin</a></p>
</footer>
</body>
</html>
